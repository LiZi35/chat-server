<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!--  write by ChatGPT  -->
    <meta charset="UTF-8">
    <title>邮箱验证码</title>
</head>

<body style="margin:0;padding:0;background:#f5f7fa;font-family:Arial,'Microsoft YaHei',sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fa;padding:40px 0;">
    <tr>
        <td align="center">

            <!-- 主容器 -->
            <table width="600" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:8px;overflow:hidden;">

                <!-- 头部 -->
                <tr>
                    <td style="
                        background:#409eff;
                        padding:30px;
                        text-align:center;
                        color:white;
                    ">
                        <h1 style="margin:0;font-size:26px;">
                            验证您的邮箱
                        </h1>
                    </td>
                </tr>


                <!-- 内容 -->
                <tr>
                    <td style="padding:40px 50px;color:#333;">

                        <p style="font-size:16px;">
                            您好！
                        </p>

                        <p style="font-size:16px;line-height:1.8;">
                            您正在进行邮箱验证操作，
                            请使用下面的验证码完成验证：
                        </p>


                        <!-- 验证码 -->
                        <div style="
                            margin:30px 0;
                            text-align:center;
                        ">
                            <span style="
                                display:inline-block;
                                padding:15px 35px;
                                background:#f0f9ff;
                                border:1px dashed #409eff;
                                border-radius:6px;
                                color:#409eff;
                                font-size:32px;
                                font-weight:bold;
                                letter-spacing:8px;
                            ">
                                {{CODE}}
                            </span>
                        </div>


                        <p style="font-size:14px;color:#666;">
                            验证码有效时间为
                            <strong style="color:#409eff;">
                                {{EXPIRE}}分钟
                            </strong>
                            ，请勿泄露给他人。
                        </p>


                        <p style="font-size:14px;color:#999;line-height:1.6;">
                            如果这不是您的操作，请忽略此邮件。
                        </p>

                    </td>
                </tr>


                <!-- 底部 -->
                <tr>
                    <td style="
                        background:#fafafa;
                        padding:20px;
                        text-align:center;
                        color:#999;
                        font-size:13px;
                    ">
                        © {{YEAR}} {{APP_NAME}}. All Rights Reserved.
                    </td>
                </tr>


            </table>


        </td>
    </tr>
</table>

</body>
</html>
